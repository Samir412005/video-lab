name: Video Lab VapourSynth Test

# Third toolchain test: VapourSynth (developer-grade Python video filtering)
# — install the core, run a .vpy script through vspipe into FFmpeg, upload MP4.
# Trigger manually from the Actions tab ("Run workflow").

on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg

      - name: Install VapourSynth
        run: |
          pip install --quiet vapoursynth
          vspipe --version

      - name: Filter with VapourSynth, encode with FFmpeg
        run: |
          mkdir -p out
          ffmpeg -y -v error -f lavfi -i "sine=frequency=440:duration=4" -c:a pcm_s16le tone.wav
          vspipe -c y4m scripts/vs_test.vpy out.y4m
          ffmpeg -y -i out.y4m -i tone.wav -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -c:a aac -b:a 128k -shortest -movflags +faststart out/video-lab-vapoursynth.mp4

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: video-lab-vapoursynth
          path: out/video-lab-vapoursynth.mp4
          if-no-files-found: error
          retention-days: 30
